<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Skynet UI example</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <meta name="description" content="A sign-in page built with Skynet UI.">
  <meta property="og:title" content="Skynet UI example: auth">
  <meta property="og:description" content="A sign-in page built with Skynet UI.">
  <meta property="og:image" content="https://skynetui.com/og.png">
  <meta property="og:url" content="https://skynetui.com/examples/auth">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="../skynet-ui.css">
</head>
<body>
  <div class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full" style="max-width: 400px">
      <div class="text-center mb-6">
        <span class="sk-navbar-logo" style="width: 44px; height: 44px; font-size: 1.2rem; display: inline-flex">S</span>
        <h1 class="text-2xl mt-3 mb-1">Welcome back</h1>
        <p class="text-muted text-sm">Sign in to your account</p>
      </div>
      <div class="sk-card"><div class="sk-card-body">
        <form data-sk-validate onsubmit="event.preventDefault(); if (this.checkValidity()) skToast('Signed in!', 'success');">
          <div class="sk-field">
            <label class="sk-label" for="email">Email</label>
            <input class="sk-input" id="email" type="email" placeholder="name@work.com" required autocomplete="email">
          </div>
          <div class="sk-field">
            <div class="flex justify-between items-center">
              <label class="sk-label" for="pw">Password</label>
              <a href="#" class="text-sm">Forgot?</a>
            </div>
            <input class="sk-input" id="pw" type="password" required minlength="8" autocomplete="current-password">
          </div>
          <label class="sk-check mb-4"><input type="checkbox" checked> Remember this device</label>
          <button class="sk-btn sk-btn-primary sk-btn-block" type="submit">Sign in</button>
        </form>
        <div class="sk-divider">or continue with</div>
        <div class="flex gap-3">
          <button class="sk-btn sk-btn-outline flex-1">GitHub</button>
          <button class="sk-btn sk-btn-outline flex-1">Google</button>
        </div>
      </div></div>
      <p class="text-center text-muted text-sm mt-4">No account? <a href="#">Start a free trial</a></p>
    </div>
  </div>
  <script src="../skynet-ui.js" defer></script>
</body>
</html>
