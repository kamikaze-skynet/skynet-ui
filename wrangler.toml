# Cloudflare Worker serving skynetui.com: static assets from site/ plus an
# MCP server at /mcp (see worker.js).
# Deploy: npx wrangler deploy   (needs CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID)
# site/_headers and site/_redirects are honored by Workers static assets.
name = "skynetui"
main = "worker.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./site"
binding = "ASSETS"
run_worker_first = ["/mcp"]
