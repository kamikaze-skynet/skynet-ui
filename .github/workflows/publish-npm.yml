# Publishes the skynet-ui package to npm.
#
# One-time setup: create an npm Automation token (npmjs.com → Access Tokens →
# Generate New Token → Automation) and add it as the NPM_TOKEN repository
# secret (Settings → Secrets and variables → Actions).
#
# Run it from the Actions tab (workflow_dispatch) after cutting a release —
# the published version is read from the skynet-ui.css header, so bump the
# framework first. Publishing an already-published version fails safely.
name: Publish to npm

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Assemble package
        run: bash scripts/build-package.sh

      - name: Show what will be published
        run: cd pkg && npm pack --dry-run

      - name: Publish
        run: cd pkg && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
