# Deploys site/ to Cloudflare (Worker with static assets — wrangler.toml at
# the repo root) on every push to main. Serves https://skynetui.com.
#
# One-time setup (repo → Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — token from the "Edit Cloudflare Workers" template
#                            (create at dash.cloudflare.com/profile/api-tokens)
#   CLOUDFLARE_ACCOUNT_ID  — shown in the right sidebar of the Cloudflare
#                            dashboard's Workers & Pages overview page
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy with wrangler
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
