# Deploys site/ to Cloudflare Pages on every push to main.
#
# One-time setup (repo → Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — token with the "Cloudflare Pages — Edit" permission
#                            (create at dash.cloudflare.com/profile/api-tokens)
#   CLOUDFLARE_ACCOUNT_ID  — shown in the right sidebar of the Cloudflare
#                            dashboard's Workers & Pages overview page
#
# The first run creates the "skynetui" Pages project automatically. After
# that first deploy, attach the domain once in the Cloudflare dashboard:
# Workers & Pages → skynetui → Custom domains → add skynetui.com.
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create the Pages project if it doesn't exist yet
        run: npx wrangler@3 pages project create skynetui --production-branch=main 2>/dev/null || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy site/ to Cloudflare Pages
        run: npx wrangler@3 pages deploy site --project-name=skynetui --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
