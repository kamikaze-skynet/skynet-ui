# Smoke tests on every PR and push to main: syntax checks, size budgets,
# and a headless-Chromium pass over the demo and every site page asserting
# zero console errors, all 9 themes, and core behaviors (tests/smoke.js).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax checks
        run: |
          node --check skynet-ui.js
          node --check worker.js
          node --check create/create.js
          node --check tests/smoke.js

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Smoke tests
        run: node tests/smoke.js
